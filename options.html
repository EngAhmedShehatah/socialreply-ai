<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialReply AI Options</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
        color: #111827;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        color: #047857;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>SocialReply AI</h1>
    <label for="apiKey">OpenAI API key</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    <button id="save" type="button">Save</button>
    <div id="status" aria-live="polite"></div>
    <script src="options.js"></script>
  </body>
</html>
